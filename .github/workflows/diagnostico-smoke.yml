name: diagnostico-smoke

on:
  pull_request:
    paths:
      - 'src/lib/scoring/**'
      - 'src/collections/DiagnosticoResults.ts'
      - 'src/collections/Leads.ts'
      - 'src/collections/DiagnosticoEvents.ts'
      - 'src/app/api/diagnostico/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/diagnostico-smoke.yml'
  push:
    branches: [main]

jobs:
  smoke:
    name: Caso Roberto + engine determinismo
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Engine tests (caso Roberto + casos extremos + determinismo)
        run: npm test -- src/lib/scoring

      - name: Typecheck
        run: npx tsc --noEmit
