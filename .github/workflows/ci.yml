name: CI

on:
  push:
    branches: [main, next-migration, sprint-*]
  pull_request:
    branches: [main, next-migration]

jobs:
  lint-typecheck-build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # O importMap do Payload é gerado (gitignored). Precisa existir ANTES do
      # lint/typecheck, senão os imports de ../importMap não resolvem (TS2307).
      - name: Generate Payload importMap
        run: npx payload generate:importmap
        env:
          PAYLOAD_SECRET: ci-test-secret-not-production
          DATABASE_URL: file:./ci-test.db

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          PAYLOAD_SECRET: ci-test-secret-not-production
          DATABASE_URL: file:./ci-test.db
          NEXT_PUBLIC_SITE_URL: https://unfoldgrowth.com.br

